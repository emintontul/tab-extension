<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloseMyTabs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CloseMyTabs</h1>
      <div class="header-controls">
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">◐</button>
        <div class="toggle-container">
          <span class="toggle-label" id="label-this"></span>
          <label class="toggle">
            <input type="checkbox" id="all-windows-toggle">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-label" id="label-all"></span>
        </div>
      </div>
    </div>
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search...">
    </div>
    <div class="toolbar">
      <button id="duplicates-btn" class="toolbar-btn" title="Find duplicates"><span class="toolbar-icon">⊘</span><span class="toolbar-label" id="label-duplicates"></span></button>
      <button id="undo-btn" class="toolbar-btn" title="Recently closed"><span class="toolbar-icon">↺</span><span class="toolbar-label" id="label-undo"></span></button>
      <button id="sessions-btn" class="toolbar-btn" title="Sessions"><span class="toolbar-icon">☰</span><span class="toolbar-label" id="label-sessions"></span></button>
    </div>
    <div id="tab-list"></div>
    <div id="undo-panel" class="panel hidden">
      <div class="panel-header">
        <span id="undo-title"></span>
        <button class="panel-close">×</button>
      </div>
      <div id="undo-list" class="panel-list"></div>
    </div>
    <div id="sessions-panel" class="panel hidden">
      <div class="panel-header">
        <span id="sessions-title"></span>
        <button class="panel-close">×</button>
      </div>
      <div class="session-save">
        <input type="text" id="session-name-input" placeholder="Session name">
        <button id="save-session-btn">💾</button>
      </div>
      <div id="sessions-list" class="panel-list"></div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <div id="selection-bar" class="selection-bar hidden">
      <span id="selected-count"></span>
      <button id="close-selected-btn" class="close-selected-btn"></button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
